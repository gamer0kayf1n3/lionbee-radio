<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>LionBee Radio</title>
    <link rel="stylesheet" href="7sd.css">
    <style>
        *:focus {
            outline-width: 0;
        }

        body {
            background-color: rgb(49, 36, 36);
        }

        .center {
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh;
            margin: 0;
        }

        #box {
            width: 820px;
            height: 312px;
            border-radius: 33px;
            flex-direction: row;
            display: flex;
            justify-content: space-around;
            align-items: center;
            padding: 0 33px;
        }

        .gradient1 {
            filter: drop-shadow(0px 20px 20px rgba(0, 0, 0, 0.2));
            background: rgb(126, 126, 126);
            background: linear-gradient(132deg, rgba(126, 126, 126, 1) 0%, rgba(0, 0, 0, 1) 100%);
        }

        .gradient2 {
            background: rgb(75, 75, 75);
            background: linear-gradient(90deg, rgba(75, 75, 75, 1) 0%, rgba(17, 17, 17, 1) 100%);
            filter: drop-shadow(0px 4px 5px rgba(0, 0, 0, 0.5));
        }

        .gradient3 {
            width: 215px;
            height: 215px;
            background: linear-gradient(90deg, #4B4B4B 0%, #111111 102.56%);
            box-shadow: 0px 4px 5px 7px rgba(0, 0, 0, 0.5), inset 33px 0px 33px #171717, inset -10px 0px 33px 4px #494949;
            border-radius: 100%;
        }

        .flextainer {
            height: 100%;
            display: flex;
            justify-content: center;
            align-items: center;
            width: auto;
        }
    </style>
</head>
